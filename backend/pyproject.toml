[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F", "B", "I001"]
ignore = ["B008"]   # FastAPI's Depends()/File() defaults are the intended pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
